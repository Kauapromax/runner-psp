
name: Build Runner PSP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar os arquivos do projeto
        uses: actions/checkout@v4

      - name: Compilar para PSP
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            pspdev/pspdev:latest \
            make

      - name: Conferir o executável
        run: |
          test -s EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Disponibilizar o EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: Runner-PSP
          path: EBOOT.PBP
          if-no-files-found: error
